api_keys:
  openai: your-openai-api-key-here
  anthropic: your-anthropic-api-key-here
  google: your-google-api-key-here
  openrouter: your-openrouter-api-key-here
  deepseek: your-deepseek-api-key-here
  qwen: your-qwen-api-key-here
  finnhub_api_key: your-finnhub-api-key-here
  alpha_vantage_api_key: your-alpha-vantage-api-key-here
  polygon_api_key: your-polygon-api-key-here
  tushare_token: your-tushare-token-here
llm_providers:
  openai:
    base_url: https://api.openai.com/v1
    models:
      deep:
      - gpt-4
      - gpt-4o
      - gpt-4-turbo
      - gpt-4o-mini
      quick:
      - gpt-3.5-turbo
      - gpt-4o-mini
  anthropic:
    base_url: https://api.anthropic.com
    models:
      deep:
      - claude-2.1
      - claude-3-opus
      - claude-3-sonnet
      quick:
      - claude-instant-1.2
      - claude-3-haiku
  google:
    base_url: https://generativelanguage.googleapis.com/v1beta
    models:
      deep:
      - gemini-2.5-pro
      quick:
      - gemini-2.5-flash
  openrouter:
    base_url: https://openrouter.ai/api/v1
    models:
      deep:
      - openai/gpt-4.1-mini
      - openai/gpt-4.1
      - google/gemini-2.5-pro      
      - openai/gpt-4o-mini-search-preview
      quick:
      - openai/gpt-4.1-mini
      - openai/gpt-4o-mini-search-preview
      - google/gemini-2.5-flash
  deepseek:
    base_url: https://api.deepseek.com/v1
    models:
      deep:
      - deepseek-resoner      
      quick:
      - deepseek-chat
  qwen:
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    models:
      deep:
      - qwen-turbo
      - qwen-plus
      - qwen-max     
      quick:
      - qwen-turbo
      - qwen-plus
models:
  llm_provider: qwen
  deep_think_llm: qwen-max
  quick_think_llm: qwen-plus
  
  embedding:
    provider: qwen 
    model: text-embedding-v4
    api_key_source: qwen 
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    dimensions: 2048
system:
  project_dir: D:\ccode\TradingAgents
  results_dir: ./results
  data_dir: ./data
  max_debate_rounds: 2
  max_risk_discuss_rounds: 1
  online_tools: true
  api_timeout: 120
  api_max_retries: 3
  api_request_timeout: 60
  api_retry_delay: 2
logging:
  version: 1
  disable_existing_loggers: false
  root_level: DEBUG
  log_dir: logs
  max_file_size: 52428800
  backup_count: 10
  retention_days: 30
  enable_async: true
  enable_structured: true
  enable_console: true
  
  categories:
    trading:
      level: INFO
      file: trading.log
      description: 交易决策、执行和风险管理相关日志
    dataflow:
      level: INFO
      file: dataflow.log
      description: 数据获取、处理和验证相关日志
    agents:
      level: INFO
      file: agents.log
      description: 智能体交互、推理和决策相关日志
    cli:
      level: INFO
      file: cli.log
      description: CLI界面和用户交互相关日志
    system:
      level: WARNING
      file: system.log
      description: 系统级别日志，包括启动、配置和严重错误
    performance:
      level: INFO
      file: performance.log
      description: 性能监控和指标相关日志
  
  development:
    root_level: INFO
    enable_console: true
    categories:
      trading:
        level: DEBUG
      dataflow:
        level: DEBUG
      agents:
        level: DEBUG
      cli:
        level: DEBUG
  
  production:
    root_level: INFO
    enable_console: false
    enable_structured: true
    categories:
      system:
        level: ERROR
      performance:
        level: WARNING

data_sources:
  yahoo_finance:
    enabled: false
    priority: 3
    description: 免费的全球股票数据，支持多个市场
  alpha_vantage:
    enabled: true
    priority: 1
    description: 提供实时和历史股票数据，需要免费API密钥，NASDAQ官方数据供应商
  polygon:
    enabled: false
    priority: 4
  tushare:
    enabled: true
    priority: 2
  sina_finance:
    enabled: false
    priority: 5
  akshare:
    enabled: true
    priority: 1
    description: 基于Python的财经数据接口库，支持多种金融产品数据，响应速度快，数据质量高
  efinance:
    enabled: false
    priority: 7
    description: 免费开源Python库，基于东方财富网API
  adata:
    enabled: false
    priority: 8
    description: 免费开源A股量化交易数据库，支持多数据源融合